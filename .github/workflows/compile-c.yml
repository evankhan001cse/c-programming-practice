name: Compile C examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    name: Build C programs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile all C examples
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=( *.c )

          if [ ${#sources[@]} -eq 0 ]; then
            echo "No C source files found in the repository root."
            exit 1
          fi

          for source in "${sources[@]}"; do
            echo "Compiling ${source}"
            gcc -std=c11 -Wall -Wextra -Wpedantic "${source}" -o "${RUNNER_TEMP}/${source%.c}"
          done
