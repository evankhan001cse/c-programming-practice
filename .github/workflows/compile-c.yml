name: Compile C examples and check platform source syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    name: Build examples and check submitted-source syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile introductory C examples
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=( *.c )

          if [ ${#sources[@]} -eq 0 ]; then
            echo "No C source files found in the repository root."
            exit 1
          fi

          for source in "${sources[@]}"; do
            echo "Compiling ${source}"
            gcc -std=c11 -Wall -Wextra -Wpedantic "${source}" -o "${RUNNER_TEMP}/${source%.c}"
          done

      - name: Syntax-check Codeforces and HackerRank C sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            echo "Checking C syntax: ${source}"
            gcc -std=c11 -Wall -Wextra -Wpedantic -fsyntax-only "${source}"
          done < <(find solutions -type f -name '*.c' -print0 | sort -z)

      - name: Syntax-check HackerRank C++ sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            echo "Checking C++ syntax: ${source}"
            g++ -std=c++20 -Wall -Wextra -Wpedantic -fsyntax-only "${source}"
          done < <(find solutions -type f \\( -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' \\) -print0 | sort -z)
